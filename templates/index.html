<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Summarizer</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #6a11cb, #2575fc);
            margin: 0;
            padding: 40px;
        }

        .container {
            max-width: 900px;
            margin: auto;
        }

        .card {
            background: white;
            padding: 25px;
            margin-bottom: 25px;
            border-radius: 15px;
            box-shadow: 0px 4px 15px rgba(0,0,0,0.2);
        }

        h1 {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        h2 {
            color: #2575fc;
        }

        input[type="file"] {
            margin: 15px 0;
        }

        button {
            background-color: #2575fc;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background-color: #1a5cd8;
        }

        .summary-box {
            background-color: #f7f9fc;
            border-left: 5px solid #2575fc;
            padding: 15px;
            border-radius: 8px;
            white-space: pre-wrap;
            line-height: 1.6;
        }

    </style>

</head>
<body>

<div class="container">

    <h1>📄 AI PDF Summarizer</h1>

    <div class="card">

        <h2>Upload PDF</h2>

        <form method="POST" enctype="multipart/form-data">

            <input type="file" name="pdf" required>

            <br><br>

            <button type="submit">
                Generate Summary
            </button>

        </form>

    </div>

    {% if summary %}

    <div class="card">

        <h2>📑 Document Summary</h2>

        <div class="summary-box">
            {{ summary }}
        </div>

    </div>

    {% endif %}

</div>

</body>
</html>
